[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-qing-guang"
version = "0.2.0"
description = "Configuration-driven glaucoma binary classification experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.scripts]
eye-qing-guang = "eye_qing_guang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
