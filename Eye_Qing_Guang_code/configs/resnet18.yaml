# Paths are resolved against the project root (or --project-root).
experiment:
  name: resnet18_image_v1
  seed: 42
  output_root: experiments

data:
  raw_root: data/raw/glaucoma_first
  manifest_dir: data/manifests/glaucoma_first_v1
  image_column: Image_name
  label_column: True_Label
  age_column: Age
  splits:
    train: {csv: train.csv, images: train, labeled: true}
    valid: {csv: valid.csv, images: valid, labeled: true}
    test: {csv: test.csv, images: test, labeled: false}
  image_size: 224
  num_workers: 0
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: 0.5
    rotation_degrees: 10

model:
  backbone: resnet18
  pretrained: true
  dropout: 0.2
  use_age: false

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss: bce
  auto_pos_weight: false
  focal_gamma: 2.0
  device: auto
  monitor: roc_auc
  patience: 5

evaluation:
  threshold: 0.5

# Confirm these column names and score type against the official submission
# template before producing a competition submission.
submission:
  id_column: Image_name
  value_column: probability
  mode: probability
